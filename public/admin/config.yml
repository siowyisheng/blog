backend:
  name: github
  repo: siowyisheng/blog
  branch: master

site_url: https://siowyisheng.github.io/blog/
display_url: https://siowyisheng.github.io/blog/
logo_url: https://siowyisheng.github.io/blog/logo.png

media_folder: public/images
public_folder: /blog/images

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: src/content/posts
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true, format: "YYYY-MM-DD" }
      - { name: tags, label: Tags, widget: list, default: [], hint: "Add as many as you like, e.g. life, design, games, code" }
      - { name: draft, label: "Draft (hidden from readers)", widget: boolean, default: false }
      - { name: body, label: Body, widget: markdown }
